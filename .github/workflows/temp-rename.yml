name: Temp rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move new build to index.html
        run: |
          git config user.name "MadPanda3ds"
          git config user.email "MadPanda3ds@users.noreply.github.com"
          git rm -q index.html
          git mv kings-and-dice-index.html index.html
          git commit -m "Update Kings & Dice — rook fix, tap-a-piece, Shanty FM and House FM"
          git push
