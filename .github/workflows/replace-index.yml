name: Replace index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move new build to index.html
        run: |
          mv kings-and-dice-index.html index.html
          git config user.name "MadPanda3ds"
          git config user.email "MadPanda3ds@users.noreply.github.com"
          git add -A
          git commit -m "Update Kings & Dice — finale gate, End Turn rule, volumes, Your Tunes, Deep FM"
          git push
