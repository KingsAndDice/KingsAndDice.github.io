name: Replace index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the new build
        run: |
          if [ ! -f kings-and-dice-index.html ]; then
            echo "No new build file found; nothing to do."
            exit 0
          fi
          git config user.name "MadPanda3ds"
          git config user.email "Inaam_1996@hotmail.com"
          git rm -q index.html
          git mv kings-and-dice-index.html index.html
          git commit -m "Update Kings & Dice — shop, locker, match re-skin, rewards modal"
          git push
