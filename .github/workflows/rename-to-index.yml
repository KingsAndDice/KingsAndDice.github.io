name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "MadPanda3ds"
          git config user.email "Inaam_1996@hotmail.com"
          git rm -q index.html
          git mv kings-and-dice-index.html index.html
          git commit -m "Rename kings-and-dice-index.html to index.html"
          git push
