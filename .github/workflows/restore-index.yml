name: Restore index.html
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy dice-chess.html to index.html
        run: |
          cp dice-chess.html index.html
          ls -l index.html dice-chess.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Kings & Dice — Quick Chat in every match"
          git push
